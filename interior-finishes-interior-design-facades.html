<style>
    /* زر الرجوع */

.back-btn{
  position:absolute;
  top:25px;
  left:30px;
  background:#fff;
  border:none;
  padding:12px 24px;
  border-radius:50px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  z-index:10000;
  transition:.3s;
}

.back-btn:hover{
  transform:translateY(-2px);
}

/* الصورة الكبيرة */
    .back-btn { display:inline-block; margin-bottom:30px; padding:12px 24px; border:none; border-radius:50px; background:#0f172a; color:#fff; cursor:pointer; text-decoration:none; }

.image-preview{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:100000;
}

.image-preview img{

  max-height:90vh;

.preview-close{

body{

  background:#fff;

  cursor:pointer;
  transition:.3s;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.service-card:hover{

}

.service-img img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.service-body{
  padding:35px;
  position:relative;
  text-align:right;
}

.service-number{
  position:absolute;
  top:20px;
  left:25px;
  font-size:55px;
  font-weight:bold;
  color:#eee;
}

.service-title{
  font-size:32px;
  color:#0f172a;
  margin-bottom:10px;
}

.service-sub{
  color:#d4a017;
  font-weight:bold;
  margin-bottom:10px;
}

  color:#6b7280;
  line-height:1.8;
}

.service-footer{
  margin-top:20px;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:10px;

/* Modal */

.gallery-modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;

  display:none;

  border-radius:20px;

.close-btn{
  position:absolute;

  .services-grid{

</style>

<script>
const galleries = {

  flooring: [
    'https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=1000',
    'https://images.unsplash.com/photo-1494526585095-c41746248156?w=1000',
    'https://images.unsplash.com/photo-1484154218962-a197022b5858?w=1000'
  ],

  counter: [
    'https://images.unsplash.com/photo-1513694203232-719a280e022f?w=1000',
    'https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=1000',
    'https://images.unsplash.com/photo-1494526585095-c41746248156?w=1000'
  ]
};

function openGallery(type){

  const modal =
    document.getElementById('galleryModal');

  const content =
    document.getElementById('galleryContent');

  content.innerHTML = '';

  galleries[type].forEach(img => {

    content.innerHTML += `
      <img src="${img}" alt="ديكور داخلي حديث ومتكامل في مساحة سكنية">
    `;
  });

  modal.style.display = 'flex';
}

function closeGallery(){
  document.getElementById('galleryModal')
  .style.display = 'none';
}

/* close outside click */
window.onclick = function(e){
  const modal =
    document.getElementById('galleryModal');

  if(e.target === modal){
    closeGallery();
  }
}


function openGallery(type){

  const modal =
    document.getElementById('galleryModal');

  const content =
    document.getElementById('galleryContent');

  content.innerHTML = '';

  galleries[type].forEach(img => {

    content.innerHTML += `
      <img 
        src="${img}" 
        alt="ديكور داخلي حديث ومتكامل في مساحة سكنية"
        onclick="openPreview('${img}')"
        style="
          width:100%;
          height:250px;
          object-fit:cover;
          border-radius:20px;
          cursor:pointer;
        "
      >
    `;
  });

  modal.style.display = 'flex';
}

function closeGallery(){
  document.getElementById('galleryModal')
  .style.display = 'none';
}

/* فتح الصورة بالحجم الطبيعي */
function openPreview(img){

  document.getElementById('previewImg')
  .src = img;

  document.getElementById('imagePreview')
  .style.display = 'flex';
}

/* قفل الصورة */
function closePreview(){

  document.getElementById('imagePreview')
  .style.display = 'none';
}

/* قفل لما تدوس برا */
window.onclick = function(e){

  const modal =
    document.getElementById('galleryModal');

  const preview =
    document.getElementById('imagePreview');

  if(e.target === modal){
    closeGallery();
  }

  if(e.target === preview){
    closePreview();
  }
}
</script>
